name: Deploy static site with Bun (gh-pages branch)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build with Bun runtime
        run: |
          bun --version
          bun run build

      - name: Deploy to gh-pages with Bun
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bunx gh-pages -d dist -b gh-pages -m "deploy: ${GITHUB_SHA}" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
